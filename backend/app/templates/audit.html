<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparency Log — Civic Platform</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/auth.js?v={{ static_v }}"></script>
  <script src="/static/js/nav.js?v={{ static_v }}"></script>
  <style>
    .audit-intro {
      background: #f9f9f9;
      border-left: 3px solid #1565c0;
      border-radius: 0 4px 4px 0;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }
    .audit-intro strong { color: #1a1a1a; }

    /* ---- Filter bar ---- */
    .audit-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
    }
    .audit-filter {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      outline: none;
    }
    .audit-filter:focus { border-color: #1565c0; }
    .audit-search {
      flex: 1;
      min-width: 200px;
    }
    .audit-clear {
      font-size: 13px;
      color: #1565c0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      text-decoration: underline;
    }
    .audit-count {
      font-size: 13px;
      color: #888;
      margin-left: auto;
      white-space: nowrap;
    }

    /* ---- Entry list ---- */
    .audit-list { display: flex; flex-direction: column; gap: 8px; }

    .audit-entry {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
    }
    .audit-entry-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .audit-event-type {
      font-weight: 600;
      color: #1a1a1a;
      font-size: 13px;
    }
    .audit-target-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f0f0f0;
      color: #555;
      border-radius: 3px;
      padding: 2px 6px;
    }
    .audit-time {
      color: #aaa;
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    .audit-ids {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #888;
    }
    .audit-id-label { font-weight: 600; color: #555; margin-right: 3px; }
    .audit-id-val {
      font-family: monospace;
      font-size: 11px;
      color: #666;
    }
    .audit-id-link {
      font-family: monospace;
      font-size: 11px;
      color: #1565c0;
      cursor: pointer;
      text-decoration: underline;
    }
    .audit-id-link:hover { color: #0d47a1; }

    .audit-payload {
      background: #f9f9f9;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 12px;
      color: #555;
      line-height: 1.7;
    }
    .audit-payload-key { font-weight: 600; color: #333; }

    /* ---- Pagination ---- */
    .audit-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    .audit-page-btn {
      padding: 8px 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .audit-page-btn:hover:not(:disabled) { background: #f5f5f5; }
    .audit-page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .audit-page-info { font-size: 13px; color: #888; }

    .audit-wiki-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #e8f4f8;
      color: #0277bd;
      border-radius: 3px;
      padding: 2px 6px;
    }

    .audit-intro a { color: #1565c0; text-decoration: underline; font-weight: 500; }
    .audit-intro a:hover { color: #0d47a1; }

    .audit-community-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .audit-community-chip {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid #1565c0;
      border-radius: 20px;
      font-size: 12px;
      color: #1565c0;
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }
    .audit-community-chip:hover { background: #e3f0fc; color: #0d47a1; }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <main class="container" style="padding-top: 32px; padding-bottom: 64px;">
    <div id="audit-breadcrumb" style="font-size:13px; color:#888; margin-bottom:12px;"></div>
    <h1 class="page-title">Transparency Log</h1>

    <div class="audit-intro">Loading…</div>

    <!-- Filter toolbar -->
    <div class="audit-toolbar">
      <select id="event-type-filter" class="audit-filter">
        <option value="">All event types</option>
      </select>
      <select id="target-type-filter" class="audit-filter">
        <option value="">All target types</option>
        <option value="thread">Thread</option>
        <option value="post">Post</option>
        <option value="proposal">Proposal</option>
        <option value="vote">Vote</option>
        <option value="signal">Signal</option>
        <option value="amendment">Amendment</option>
        <option value="proposal_comment">Comment</option>
        <option value="user">User</option>
        <option value="facilitator_request">Facilitator Request</option>
      </select>
      <input id="id-search" class="audit-filter audit-search" type="search"
             placeholder="Filter by target or actor ID (UUID)…" autocomplete="off">
      <button class="audit-clear" onclick="clearFilters()">Clear</button>
      <span id="audit-count" class="audit-count"></span>
    </div>

    <div id="audit-container">
      <div class="loading">Loading audit log…</div>
    </div>

    <div class="audit-pagination" id="pagination" style="display:none">
      <button class="audit-page-btn" id="prev-btn" onclick="changePage(-1)" disabled>← Previous</button>
      <span class="audit-page-info" id="page-info"></span>
      <button class="audit-page-btn" id="next-btn" onclick="changePage(1)">Next →</button>
    </div>
  </main>

  <script src="/static/js/utils.js?v={{ static_v }}"></script>
  <script src="/static/js/api.js?v={{ static_v }}"></script>
  <script>
    const PAGE_SIZE = 50;
    let currentOffset = 0;
    let currentTotal  = 0;

    // Detect community context from /c/{slug}/audit
    const _communityAuditMatch = window.location.pathname.match(/^\/c\/([^/]+)\/audit/);
    const COMMUNITY_SLUG = _communityAuditMatch ? _communityAuditMatch[1] : null;

    if (COMMUNITY_SLUG) {
      document.title = `Audit Log — ${COMMUNITY_SLUG}`;
    }

    // ---- Human-readable event type labels ----
    const EVENT_LABELS = {
      // Identity
      user_registered:               "User Registered",
      user_tier_changed:             "Tier Changed",
      user_deactivated:              "User Deactivated",
      display_name_changed:          "Display Name Changed",
      // Threads
      thread_created:                "Thread Created",
      thread_phase_advanced:         "Phase Advanced",
      // Posts
      post_created:                  "Post Created",
      post_removed:                  "Post Removed",
      // Signals
      signal_cast:                   "Signal Cast",
      signal_updated:                "Signal Updated",
      // Proposals
      proposal_created:              "Proposal Created",
      proposal_submitted:            "Proposal Submitted",
      proposal_status_changed:       "Proposal Status Changed",
      proposal_edited:               "Proposal Edited",
      proposal_deleted:              "Proposal Deleted",
      // Comments & amendments
      proposal_comment_created:      "Comment Created",
      proposal_comment_removed:      "Comment Removed",
      amendment_submitted:           "Amendment Submitted",
      amendment_accepted:            "Amendment Accepted",
      amendment_rejected:            "Amendment Rejected",
      // Voting & allocation
      vote_cast:                     "Vote Cast",
      allocation_decided:            "Allocation Decided",
      // Facilitator requests
      facilitator_request_submitted: "Facilitator Request Submitted",
      facilitator_request_approved:  "Facilitator Request Approved",
      facilitator_request_denied:    "Facilitator Request Denied",
      // Annotations
      annotation_created:            "Annotation Created",
      annotation_updated:            "Annotation Updated",
      annotation_deleted:            "Annotation Deleted",
      annotation_reaction_added:     "Annotation Reaction Added",
      annotation_reaction_removed:   "Annotation Reaction Removed",
      annotation_resolved:           "Annotation Resolved",
      annotation_unresolved:         "Annotation Reopened",
      annotation_featured:           "Annotation Featured",
      annotation_unfeatured:         "Annotation Unfeatured",
      annotation_orphaned:           "Annotation Orphaned",
      annotation_moderated:          "Annotation Moderated",
      // Annotator management
      user_annotator_granted:        "Annotator Granted",
      user_annotator_revoked:        "Annotator Revoked",
      annotator_request_submitted:   "Annotator Request Submitted",
      annotator_request_approved:    "Annotator Request Approved",
      annotator_request_denied:      "Annotator Request Denied",
      // Community
      community_created:             "Community Created",
      community_updated:             "Community Updated",
      community_member_joined:       "Member Joined",
      community_member_promoted:     "Member Promoted",
      // LLM (future)
      llm_summary_generated:         "LLM Summary Generated",
    };

    // Colour-code event types by category
    const EVENT_COLORS = {
      thread_created:                "#1565c0",
      thread_phase_advanced:         "#6a1b9a",
      post_created:                  "#2e7d32",
      post_removed:                  "#c62828",
      signal_cast:                   "#e65100",
      signal_updated:                "#e65100",
      proposal_created:              "#00695c",
      proposal_submitted:            "#00695c",
      proposal_status_changed:       "#00695c",
      proposal_edited:               "#00695c",
      proposal_deleted:              "#c62828",
      vote_cast:                     "#1565c0",
      allocation_decided:            "#4a148c",
      facilitator_request_submitted: "#4e342e",
      facilitator_request_approved:  "#2e7d32",
      facilitator_request_denied:    "#c62828",
      annotation_created:            "#37474f",
      annotation_updated:            "#37474f",
      annotation_deleted:            "#c62828",
      annotation_reaction_added:     "#37474f",
      annotation_reaction_removed:   "#37474f",
      annotation_resolved:           "#2e7d32",
      annotation_unresolved:         "#e65100",
      annotation_featured:           "#f59e0b",
      annotation_moderated:          "#c62828",
      community_created:             "#1565c0",
      community_updated:             "#1565c0",
      community_member_joined:       "#2e7d32",
      community_member_promoted:     "#6a1b9a",
    };

    function eventLabel(type) {
      return EVENT_LABELS[type] || type.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function eventColor(type) {
      return EVENT_COLORS[type] || "#555";
    }

    // Render payload as readable key: value lines, skipping very long values
    function renderPayload(payload) {
      const entries = Object.entries(payload);
      if (entries.length === 0) return "";
      const lines = entries.map(([k, v]) => {
        const label = k.replace(/_/g, " ");
        const val   = typeof v === "object" ? JSON.stringify(v) : String(v);
        const display = val.length > 120 ? val.slice(0, 120) + "…" : val;
        return `<span class="audit-payload-key">${esc(label)}:</span> ${esc(display)}`;
      }).join("<br>");
      return `<div class="audit-payload">${lines}</div>`;
    }

    // Clicking an actor/target ID sets it as a filter
    function filterById(id) {
      document.getElementById("id-search").value = id;
      currentOffset = 0;
      loadAudit();
    }

    function renderEntry(entry) {
      const label     = eventLabel(entry.event_type);
      const color     = eventColor(entry.event_type);
      const timeStr   = new Date(entry.created_at).toLocaleString();
      const timeAgoStr = timeAgo(entry.created_at);
      const payload   = renderPayload(entry.payload || {});

      const isWikiAnnotation = COMMUNITY_SLUG === null && entry.event_type.startsWith('annotation_');
      const wikiBadge = isWikiAnnotation ? `<span class="audit-wiki-badge">wiki</span>` : '';

      const actorHtml = entry.actor_id
        ? `<span><span class="audit-id-label">Actor:</span>
           <span class="audit-id-link" onclick="filterById('${esc(entry.actor_id)}')"
                 title="Filter by this actor">${esc(entry.actor_id)}</span></span>`
        : `<span><span class="audit-id-label">Actor:</span> <span class="audit-id-val">system</span></span>`;

      const targetHtml = `<span><span class="audit-id-label">Target:</span>
        <span class="audit-id-link" onclick="filterById('${esc(entry.target_id)}')"
              title="Filter by this target">${esc(entry.target_id)}</span></span>`;

      return `
        <div class="audit-entry">
          <div class="audit-entry-header">
            <span class="audit-event-type" style="color:${color}">${esc(label)}</span>
            <span class="audit-target-badge">${esc(entry.target_type)}</span>
            ${wikiBadge}
            <span class="audit-time" title="${esc(timeStr)}">${esc(timeAgoStr)}</span>
          </div>
          <div class="audit-ids">${actorHtml}${targetHtml}</div>
          ${payload}
        </div>`;
    }

    // ---- Filters ----

    function getFilters() {
      const eventType  = document.getElementById("event-type-filter").value;
      const targetType = document.getElementById("target-type-filter").value;
      const raw        = document.getElementById("id-search").value.trim();
      // UUID pattern — could be actor or target
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw);
      return {
        eventType:  eventType  || undefined,
        targetType: targetType || undefined,
        // Ambiguous: search as target_id first; actor filter is separate
        targetId:   (isUuid && raw) ? raw : undefined,
        actorId:    undefined,
      };
    }

    function clearFilters() {
      document.getElementById("event-type-filter").value = "";
      document.getElementById("target-type-filter").value = "";
      document.getElementById("id-search").value = "";
      currentOffset = 0;
      loadAudit();
    }

    // ---- Pagination ----

    function changePage(dir) {
      currentOffset = Math.max(0, currentOffset + dir * PAGE_SIZE);
      loadAudit();
      window.scrollTo(0, 0);
    }

    function updatePagination(total) {
      currentTotal = total;
      const totalPages   = Math.ceil(total / PAGE_SIZE);
      const currentPage  = Math.floor(currentOffset / PAGE_SIZE) + 1;
      const pagination   = document.getElementById("pagination");
      const pageInfo     = document.getElementById("page-info");
      const prevBtn      = document.getElementById("prev-btn");
      const nextBtn      = document.getElementById("next-btn");

      pagination.style.display = totalPages > 1 ? "flex" : "none";
      pageInfo.textContent      = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled          = currentOffset === 0;
      nextBtn.disabled          = currentOffset + PAGE_SIZE >= total;
    }

    // ---- Main load ----

    async function loadAudit() {
      const container = document.getElementById("audit-container");
      const countEl   = document.getElementById("audit-count");
      container.innerHTML = `<div class="loading">Loading…</div>`;

      try {
        const filters = getFilters();
        const page = COMMUNITY_SLUG
          ? await getCommunityAuditLog(COMMUNITY_SLUG, { ...filters, limit: PAGE_SIZE, offset: currentOffset })
          : await getAuditLog({ ...filters, limit: PAGE_SIZE, offset: currentOffset });

        countEl.textContent = `${page.total.toLocaleString()} event${page.total !== 1 ? "s" : ""}`;
        updatePagination(page.total);

        if (page.entries.length === 0) {
          container.innerHTML = `<div class="empty-state">No events match these filters.</div>`;
          return;
        }

        container.innerHTML = `<div class="audit-list">${page.entries.map(renderEntry).join("")}</div>`;

      } catch (err) {
        container.innerHTML = `<div class="error-message">Could not load audit log: ${esc(err.message)}</div>`;
      }
    }

    // ---- Populate event type dropdown from known enum ----
    function populateEventTypes() {
      const select = document.getElementById("event-type-filter");
      Object.entries(EVENT_LABELS)
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([value, label]) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = label;
          select.appendChild(opt);
        });
    }

    // ---- Dynamic intro copy ----

    async function loadAuditIntro() {
      const intro = document.querySelector('.audit-intro');

      if (COMMUNITY_SLUG) {
        try {
          const community = await getCommunity(COMMUNITY_SLUG);
          const breadcrumb = document.getElementById("audit-breadcrumb");
          if (breadcrumb) {
            breadcrumb.innerHTML = `<a href="/" style="color:#1565c0; text-decoration:none;">← All Communities</a> <span style="margin:0 4px;">/</span> <a href="/c/${esc(COMMUNITY_SLUG)}" style="color:#1565c0; text-decoration:none;">${esc(community.name)}</a> <span style="margin:0 4px;">/</span> Transparency Log`;
          }
        } catch (_) { /* non-fatal */ }
        intro.innerHTML = `
          <strong>Community audit log — <em>${esc(COMMUNITY_SLUG)}</em>.</strong>
          An append-only record of deliberation events in this community:
          proposals, threads, votes, signals, and membership changes.
          <br>Platform-level events (wiki annotations, user management) are at the
          <a href="/audit">platform transparency log</a>.
        `;
        return;
      }

      // Platform audit: build community navigation links
      let communityLinksHtml = '';
      try {
        const publicCommunities = await listCommunities();
        const bySlug = new Map(publicCommunities.map(c => [c.slug, c.name]));

        // If logged in, also surface communities the user is a member of
        if (auth.isSignedIn()) {
          try {
            const me = await getMe();
            for (const m of (me.communityMemberships || [])) {
              if (!bySlug.has(m.communitySlug)) {
                bySlug.set(m.communitySlug, m.communityName);
              }
            }
          } catch (_) { /* non-fatal */ }
        }

        if (bySlug.size > 0) {
          const chips = [...bySlug.entries()]
            .map(([slug, name]) => `<a href="/c/${esc(slug)}/audit" class="audit-community-chip">${esc(name)}</a>`)
            .join('');
          communityLinksHtml = `<div class="audit-community-nav">${chips}</div>`;
        }
      } catch (_) { /* non-fatal — skip links if fetch fails */ }

      intro.innerHTML = `
        <strong>Platform transparency log.</strong>
        An append-only public record of platform-level events: user onboarding,
        wiki annotations, annotator management, and community creation. No login required.
        <br>Deliberation events (proposals, threads, votes, signals) are in each community's
        own audit log.${communityLinksHtml}
      `;
    }

    // ---- Wire up filters ----
    document.getElementById("event-type-filter").addEventListener("change",  () => { currentOffset = 0; loadAudit(); });
    document.getElementById("target-type-filter").addEventListener("change", () => { currentOffset = 0; loadAudit(); });
    document.getElementById("id-search").addEventListener("input", () => { currentOffset = 0; loadAudit(); });

    populateEventTypes();
    loadAuditIntro();
    loadAudit();
  </script>

</body>
</html>
